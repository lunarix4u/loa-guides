<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOA Guides — гайды по Lost Ark</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button">☀️ Светлая тема</button>
  <header class="site-header">
    <h1>LOA Guides</h1>
    <p>Гайды по рейдам Lost Ark</p>
  </header>

  <main class="container">
    <section class="raid-list">
      <h2>Рейды</h2>

      <a class="raid-card" href="belgardin/">
        <h3>Бельгардин</h3>
        <p>Обычка и экспидиция 1750 / Героик 1770 / Кошмар 1780 гс [доступен в игре с 21 октября 2026 года]</p>
      </a>

    </section>
  </main>

  <footer class="site-footer">
    <p>Гайды составлены игроком. Lost Ark — товарный знак его правообладателей.</p>
  </footer>
  <script>
  const toggle = document.getElementById('themeToggle');
  const savedTheme = localStorage.getItem('theme');

  if (savedTheme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    toggle.textContent = '🌙 Тёмная тема';
  }

  toggle.addEventListener('click', () => {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';

    if (isLight) {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('theme', 'dark');
      toggle.textContent = '☀️ Светлая тема';
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      localStorage.setItem('theme', 'light');
      toggle.textContent = '🌙 Тёмная тема';
    }
  });
</script>
</body>
</html>
