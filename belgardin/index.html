<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бельгардин — гайд | LOA Guides</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button">☀️ Светлая тема</button>
  <header class="site-header">
    <h1>Бельгардин</h1>
    <p><a href="../" style="color:#7fb3ff;">← На главную</a></p>
  </header>

  <main class="container guide-content">
    <h2>Фазы рейда</h2>

    <a class="raid-card" href="p1/">
      <h3>Фаза 1</h3>
      <p>Механики, распределение, тайминги и важные ошибки.</p>
    </a>

    <a class="raid-card" href="p2/">
      <h3>Фаза 2</h3>
      <p>Гайд появится позже.</p>
    </a>
  </main>
  <script>
  const toggle = document.getElementById('themeToggle');
  const savedTheme = localStorage.getItem('theme');

  if (savedTheme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    toggle.textContent = '🌙 Тёмная тема';
  }

  toggle.addEventListener('click', () => {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';

    if (isLight) {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('theme', 'dark');
      toggle.textContent = '☀️ Светлая тема';
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      localStorage.setItem('theme', 'light');
      toggle.textContent = '🌙 Тёмная тема';
    }
  });
</script>
</body>
</html>
